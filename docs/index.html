<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>映えチェック</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header id="appHeader">
    <h1>映えチェック</h1>
    <button id="settingsToggle" type="button" aria-haspopup="dialog">設定</button>
  </header>

  <p id="notice">判定時、撮影フレームを api.codiv.ai に送信します</p>

  <p id="modeIndicator" aria-label="現在の質問セットと表示モード"></p>
  <p id="fallbackNotice" hidden></p>

  <div id="cameraArea">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="cameraPlaceholder">
      <button id="startCameraBtn" type="button">カメラを開始</button>
    </div>
  </div>

  <section id="zoomSection" aria-label="ズーム" hidden>
    <div class="metric-row">
      <span class="metric-label">ズーム</span>
      <input type="range" id="zoomSlider" min="1" max="1" step="0.1" value="1" />
      <span id="zoomValue" class="metric-value">1.0x</span>
    </div>
  </section>

  <button id="shutterButton" type="button">撮影する</button>

  <div id="shotRatingBand" hidden>
    <span>この写真に満足?</span>
    <button id="shotRatingUp" type="button" aria-label="満足">👍</button>
    <button id="shotRatingDown" type="button" aria-label="不満">👎</button>
  </div>

  <button id="motionPermissionBtn" type="button" hidden>
    センサーの利用を許可(iOSのみ)
  </button>

  <section id="controls" aria-label="送信操作">
    <label id="autoSendLabel">
      <input type="checkbox" id="autoSendToggle" checked />
      自動送信(静止を検出したら判定)
    </label>
    <button id="judgeNowBtn" type="button">今すぐ判定</button>
  </section>

  <section id="metrics" aria-label="端末内で計算する画質指標">
    <div class="metric-row">
      <span class="metric-label">ブレ</span>
      <meter id="blurMeter" min="0" max="100" value="0"></meter>
      <span id="blurValue" class="metric-value">--</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">明るさ</span>
      <meter id="brightnessMeter" min="0" max="100" value="0"></meter>
      <span id="brightnessValue" class="metric-value">--</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">水平</span>
      <meter id="levelMeter" min="0" max="100" value="0"></meter>
      <span id="levelValue" class="metric-value">--</span>
    </div>
    <div id="stillnessBadge" class="badge">静止待ち</div>
  </section>

  <section id="guidancePanel" aria-label="画角ガイド">
    <div id="templateChips" role="group" aria-label="テンプレート選択"></div>
    <p id="instructionText">被写体を認識するとガイドが表示されます</p>
    <div id="instructionFeedback" hidden>
      <button id="instructionUnderstoodBtn" type="button">伝わった</button>
      <button id="instructionUnclearBtn" type="button">分かりにくい</button>
    </div>
  </section>

  <section id="resultPanel" aria-label="判定結果">
    <p id="resultStatus">まだ判定していません</p>
    <img id="resultThumbnail" alt="この判定に使われた写真" hidden />
    <dl id="resultDetails"></dl>
    <p id="resultMeta"></p>
    <div id="feedbackButtons" hidden>
      <span>この判定は役に立ちましたか?</span>
      <button id="thumbsUp" type="button" aria-label="役に立った">👍</button>
      <button id="thumbsDown" type="button" aria-label="役に立たなかった">👎</button>
    </div>
  </section>

  <section id="logSection" aria-label="ログ">
    <button id="exportLogBtn" type="button">ログをJSONで書き出す</button>
    <span id="logCount">記録: 0件</span>
  </section>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>設定</h2>

      <label class="field">
        質問セット
        <select id="questionSetSelect">
          <option value="A">A(現行9項目)</option>
          <option value="B">B(直すべき点 中心・軽量4項目)</option>
          <option value="C">C(直すべき点+はい/いいえ項目・詳細11項目)</option>
        </select>
      </label>
      <p class="field-note">
        B・Cで実APIが4xxを返した場合、このセッションだけ自動的にAへ切り替わります(通知が出ます)。
      </p>

      <label class="field">
        表示モード
        <select id="uiModeSelect">
          <option value="multi">multi(詳細表示)</option>
          <option value="single">single(主指示だけ大きく表示)</option>
        </select>
      </label>

      <label class="field-checkbox">
        <input type="checkbox" id="templateMatchToggle" />
        サーバーに構図マッチ(template_match)も問い合わせる(実験的・既定OFF)
      </label>

      <label class="field">
        エンドポイント
        <input type="url" id="endpointInput" placeholder="https://api.codiv.ai/v1/systemone" />
      </label>

      <label class="field">
        モデル名
        <input type="text" id="modelInput" placeholder="openjev-latest" />
      </label>

      <label class="field">
        APIキー
        <input type="password" id="apiKeyInput" autocomplete="off" placeholder="Bearerトークン" />
      </label>
      <p class="field-note">
        APIキーはこの端末のブラウザ(localStorage)にのみ保存され、リポジトリやサーバーには送られません。
      </p>

      <label class="field">
        送信画像サイズ(長辺px)
        <input type="number" id="maxSideInput" min="128" max="2048" step="16" value="768" />
      </label>

      <label class="field-checkbox">
        <input type="checkbox" id="settingsAutoSendToggle" checked />
        自動送信(静止を検出したら判定)
      </label>

      <label class="field-checkbox">
        <input type="checkbox" id="mockModeToggle" />
        モックモード(APIを呼ばず疑似応答で動作確認)
      </label>

      <div class="field-row">
        <button id="testConnectionBtn" type="button">接続テスト</button>
        <span id="connectionTestResult"></span>
      </div>

      <div class="field-row">
        <button id="saveSettingsBtn" type="submit">保存して閉じる</button>
        <button id="closeSettingsBtn" type="button">キャンセル</button>
      </div>
    </form>
  </dialog>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
