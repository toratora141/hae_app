<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>アングル実験</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header id="appHeader">
    <h1>アングル実験</h1>
    <button id="settingsToggle" type="button" aria-haspopup="dialog">設定</button>
  </header>

  <p id="notice">
    この実験は docs/angle/ の独立ページです。撮影フレームを api.codiv.ai に送信します
  </p>

  <div id="cameraArea">
    <video id="video" playsinline autoplay muted></video>
    <div id="cameraPlaceholder">
      <button id="startCameraBtn" type="button">カメラを開始</button>
    </div>
  </div>

  <div id="stillnessBadge" class="badge">静止待ち</div>

  <section id="resultPanel" aria-label="判定結果">
    <p id="resultStatus">まだ判定していません</p>

    <dl id="angleValues">
      <dt>現在のアングル</dt>
      <dd id="cameraAngleValue">--</dd>
      <dt>おすすめのアングル</dt>
      <dd id="recommendedAngleValue">--</dd>
    </dl>

    <p id="guidanceMessage"></p>
    <p id="resultMeta"></p>
  </section>

  <section id="controls" aria-label="送信操作">
    <label id="autoSendLabel">
      <input type="checkbox" id="autoSendToggle" checked />
      自動送信(静止を検出したら判定)
    </label>
    <button id="judgeNowBtn" type="button">判定</button>
  </section>

  <section id="logSection" aria-label="ログ">
    <button id="exportLogBtn" type="button">ログをJSONで書き出す</button>
    <span id="logCount">記録: 0件</span>
  </section>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>設定</h2>

      <label class="field">
        エンドポイント
        <input type="url" id="endpointInput" placeholder="https://api.codiv.ai/v1/systemone" />
      </label>

      <label class="field">
        モデル名
        <input type="text" id="modelInput" placeholder="openjev-latest" />
      </label>

      <label class="field">
        APIキー
        <input type="password" id="apiKeyInput" autocomplete="off" placeholder="Bearerトークン" />
      </label>
      <p class="field-note">
        APIキーはこの端末のブラウザ(localStorage)にのみ保存され、リポジトリやサーバーには送られません。
        メインページ(docs/index.html)の設定が保存済みなら、初期値として読み込みます(保存はこのページ専用の項目にのみ行います)。
      </p>

      <div class="field-row">
        <button id="saveSettingsBtn" type="submit">保存して閉じる</button>
        <button id="closeSettingsBtn" type="button">キャンセル</button>
      </div>
    </form>
  </dialog>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
